# One host, two processes, one bill.
# Next.js is public on :3000. Ephemeris is only on the compose network
# (and 127.0.0.1:8000 on the host for debugging). Set EPHEMERIS_SHARED_SECRET
# even on localhost — non-negotiable #3.
#
#   cp .env.example .env   # fill secrets, never commit .env
#   docker compose up --build

services:
  ephemeris:
    build:
      context: ./python-service
    environment:
      EPHEMERIS_SHARED_SECRET: ${EPHEMERIS_SHARED_SECRET:?Set EPHEMERIS_SHARED_SECRET in .env}
      EPHEMERIS_REQUIRE_SECRET: "1"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 25s
    restart: unless-stopped

  web:
    build:
      context: ./astro-coach
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    environment:
      NODE_ENV: production
      EPHEMERIS_SERVICE_URL: http://ephemeris:8000
      EPHEMERIS_SHARED_SECRET: ${EPHEMERIS_SHARED_SECRET:?Set EPHEMERIS_SHARED_SECRET in .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      CRON_SECRET: ${CRON_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    ports:
      - "3000:3000"
    depends_on:
      ephemeris:
        condition: service_healthy
    restart: unless-stopped
