# Fly Machine: Next + uvicorn in one container (root Dockerfile).
# Change `app` after `fly launch`. Do not auto-stop — that is how the
# ephemeris sidecar dies and the UI shows "Ephemeris service is not running".

app = "astro-coach"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  EPHEMERIS_SERVICE_URL = "http://127.0.0.1:8000"
  EPHEMERIS_REQUIRE_SECRET = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
