name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:

jobs:
  astro-coach:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-coach
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: astro-coach/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  python-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  one-host-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose (no build)
        run: |
          EPHEMERIS_SHARED_SECRET=ci-not-a-real-secret \
          NEXTAUTH_SECRET=ci-not-a-real-secret \
          docker compose config

  # Catches a broken Dockerfile or a next build that only fails when the
  # public Supabase variables are supplied as Docker build args. Does not push.
  one-host-image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://ci.example.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_ci
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=ci
